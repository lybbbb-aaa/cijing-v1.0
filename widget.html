<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<title>词境</title>
<link href="fonts/eb-garamond.css" rel="stylesheet"/>
<style>
/* Chinese system font fallback (offline) */
body { font-family: "Noto Serif SC","Source Han Serif SC","Source Han Serif","STSong","SimSun",serif; }
</style>
<style>
/* ── Themes ── */
:root{
  --bg:rgba(12,17,14,0.94);
  --border:rgba(60,90,70,0.55);
  --accent:#7eb89a;
  --accent-rgb:126,184,154;
  --accent2:#3a6a52;
  --dot-grad:linear-gradient(135deg,#4a7a62,#7eb89a);
  --text:#ede5d5;
  --text-muted:#7a8a7e;
  --text-dim:#3a4a3e;
  --panel-bg:rgba(10,14,12,0.99);
  --word-color:#e8e0d0;
}
.theme-blue{
  --bg:rgba(10,14,20,0.94);
  --border:rgba(50,70,110,0.55);
  --accent:#7ab0d8;
  --accent-rgb:122,176,216;
  --accent2:#3a5a82;
  --dot-grad:linear-gradient(135deg,#3a5a82,#7ab0d8);
  --text:#dde8f5;
  --text-muted:#7a8aaa;
  --text-dim:#3a4a6e;
  --panel-bg:rgba(8,12,20,0.99);
  --word-color:#e0e8f5;
}
.theme-purple{
  --bg:rgba(14,10,20,0.94);
  --border:rgba(80,50,110,0.55);
  --accent:#a87ad8;
  --accent-rgb:168,122,216;
  --accent2:#5a3a82;
  --dot-grad:linear-gradient(135deg,#5a3a82,#a87ad8);
  --text:#ecddf5;
  --text-muted:#8a7aaa;
  --text-dim:#4a3a6e;
  --panel-bg:rgba(12,8,20,0.99);
  --word-color:#ecddf5;
}
.theme-amber{
  --bg:rgba(18,14,8,0.94);
  --border:rgba(100,75,30,0.55);
  --accent:#d4a84b;
  --accent-rgb:212,168,75;
  --accent2:#7a5a20;
  --dot-grad:linear-gradient(135deg,#7a5a20,#d4a84b);
  --text:#f5e8cc;
  --text-muted:#aa8a5a;
  --text-dim:#6a4a20;
  --panel-bg:rgba(16,12,6,0.99);
  --word-color:#f5e8cc;
}
.theme-rose{
  --bg:rgba(20,10,12,0.94);
  --border:rgba(110,50,60,0.55);
  --accent:#d87a8a;
  --accent-rgb:216,122,138;
  --accent2:#823a48;
  --dot-grad:linear-gradient(135deg,#823a48,#d87a8a);
  --text:#f5dde2;
  --text-muted:#aa7a80;
  --text-dim:#6e3a40;
  --panel-bg:rgba(18,8,10,0.99);
  --word-color:#f5dde2;
}
/* Light theme */
.theme-light{
  --bg:rgba(245,242,235,0.97);
  --border:rgba(180,200,185,0.6);
  --accent:#3a7a5a;
  --accent-rgb:58,122,90;
  --accent2:#2a5a40;
  --dot-grad:linear-gradient(135deg,#2a5a40,#3a7a5a);
  --text:#1a2a1e;
  --text-muted:#5a7a64;
  --text-dim:#a0b8a8;
  --panel-bg:rgba(238,235,228,0.99);
  --word-color:#1a2a1e;
}
.theme-light .widget{
  box-shadow:0 8px 32px rgba(0,0,0,0.18),0 0 0 1px rgba(58,122,90,0.12),inset 0 1px 0 rgba(255,255,255,0.8);
}
.theme-light .topbar{
  background:rgba(255,255,255,0.5);
  border-bottom:1px solid rgba(180,200,185,0.5);
}
.theme-light .body{ background:transparent; }
.theme-light .acts{ border-top:1px solid rgba(180,200,185,0.4); }
.theme-light .prog-bar{ background:rgba(180,200,185,0.3); }
.theme-light .prog-info{ color:var(--text-dim); }
.theme-light .stats{ border-top:none; }
.theme-light .word{ color:#1a2a1e; }
.theme-light .def-cn{ color:#1a2a1e; }
.theme-light .def-en{ color:#5a7a64; }
.theme-light .example{ background:rgba(58,122,90,0.06);border-left-color:rgba(58,122,90,0.4); }
.theme-light .ex-en{ color:#5a7a64; }
.theme-light .filter-bar{ border-bottom:1px solid rgba(180,200,185,0.45); }
.theme-light .tbtn{ color:#8aaa94;border-color:rgba(58,122,90,0.15); }
.theme-light .list-panel{ border-top:1px solid rgba(180,200,185,0.5); }
.theme-light .list-item{ border-bottom:1px solid rgba(180,200,185,0.3); }
.theme-light .li-word{ color:#1a2a1e; }
.theme-light .li-cn{ color:#5a7a64; }
/* theme picker panel */
.theme-panel{
  display:none;
  flex-direction:row;flex-wrap:wrap;gap:5px;align-items:center;
  padding:7px 12px 8px;
  background:rgba(var(--accent-rgb),0.04);
  border-bottom:1px solid rgba(var(--accent-rgb),0.15);
}
.theme-panel.on{ display:flex; }
.theme-panel-title{ font-size:9px;color:var(--text-dim);letter-spacing:.1em;width:100%;margin-bottom:1px; }
.theme-opt{
  display:flex;align-items:center;gap:4px;
  padding:3px 7px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;
  transition:all .12s;
}
.theme-opt:hover{ border-color:rgba(var(--accent-rgb),0.3);background:rgba(var(--accent-rgb),0.06); }
.theme-opt.active{ border-color:rgba(var(--accent-rgb),0.5);background:rgba(var(--accent-rgb),0.1); }
.theme-dot{ width:8px;height:8px;border-radius:50%;flex-shrink:0; }
.theme-label{ font-size:9px;color:var(--text-muted);font-family:"Noto Serif SC",serif;white-space:nowrap; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:300px;background:transparent;
  font-family:"Noto Serif SC",serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;user-select:none;
  border-radius:16px;
}
.widget{
  width:300px;
  position:relative;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:0 12px 40px rgba(0,0,0,0.6),0 0 0 1px rgba(126,184,154,0.07),inset 0 1px 0 rgba(255,255,255,0.04);
}

/* ── Topbar ── */
.topbar{
  height:34px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:nowrap;
  padding:0 10px;
  background:rgba(255,255,255,0.02);
  border-bottom:1px solid rgba(42,56,48,0.7);
  cursor:default;
}
.topbar-left{ display:flex;align-items:center;gap:6px;flex-shrink:0; }
.logo-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
  background:var(--dot-grad);
  box-shadow:0 0 5px rgba(var(--accent-rgb),0.4);
}
.logo-text{
  font-size:11px;font-weight:500;color:var(--accent);
  letter-spacing:.2em;white-space:nowrap;flex-shrink:0;
}
.topbar-right{ display:flex;gap:3px;align-items:center;flex-shrink:0; }

/* inline opacity slider */
.opacity-range-inline{
  -webkit-appearance:none;
  width:38px;height:3px;
  background:rgba(var(--accent-rgb),0.2);
  border-radius:2px;cursor:pointer;outline:none;
  align-self:center;margin:0 1px;flex-shrink:0;
}
.opacity-range-inline::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);cursor:ew-resize;
  box-shadow:0 0 3px rgba(var(--accent-rgb),0.6);
}

/* topbar buttons */
.tbtn{
  width:20px;height:20px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.07);
  background:transparent;
  color:#3a4a3e;font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0;
}
.tbtn:hover{ background:rgba(var(--accent-rgb),0.12);color:var(--accent);border-color:rgba(var(--accent-rgb),0.3); }
.tbtn.close:hover{ background:rgba(192,112,112,0.15);color:#c07070;border-color:rgba(192,112,112,0.35); }
#mute-btn.on{ color:#c07070;border-color:rgba(192,112,112,0.4); }
#anim-btn.on{ color:#7eb89a;border-color:rgba(126,184,154,0.4); }
.more-menu{ position:fixed;background:var(--panel-bg);border:1px solid var(--border);border-radius:10px;padding:4px;z-index:200;min-width:130px;box-shadow:0 4px 16px rgba(0,0,0,0.3);display:none; }
.more-item{ padding:7px 12px;font-size:11px;color:var(--text);cursor:pointer;border-radius:6px;white-space:nowrap;letter-spacing:.03em; }
.more-item:hover{ background:rgba(var(--accent-rgb),0.1); }
#mute-item.on{ color:#c07070; }
#anim-item.on{ color:#7eb89a; }
.tbtn.pin.on{ background:rgba(var(--accent-rgb),0.15);color:var(--accent);border-color:rgba(var(--accent-rgb),0.4); }

/* ── Streak banner ── */
.streak-banner{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:3px 12px;font-size:9px;color:#b8944e;
  border-bottom:1px solid rgba(42,56,48,0.4);
  background:rgba(201,169,110,0.05);
  letter-spacing:.04em;
}
.streak-banner.hide{ display:none; }

/* ── Filter bar ── */
.filter-bar{
  display:flex;align-items:center;gap:4px;
  padding:5px 12px 4px;
  border-bottom:1px solid rgba(42,56,48,0.45);
}
.filt-btn{
  height:19px;padding:0 8px;
  border-radius:10px;
  border:1px solid rgba(60,90,70,0.35);
  background:transparent;
  color:#3a5a44;
  font-family:"Noto Serif SC",serif;
  font-size:10px;font-weight:500;
  cursor:pointer;transition:all .15s;
}
.filt-btn:hover{ border-color:var(--accent);color:var(--accent); }
.filt-btn.active{ background:rgba(var(--accent-rgb),0.1);border-color:var(--accent);color:var(--accent); }
.filt-btn[data-f="h"].active{ border-color:var(--accent);color:var(--accent);background:rgba(var(--accent-rgb),.1); }
.filt-btn[data-f="c"].active{ border-color:#c9a96e;color:#c9a96e;background:rgba(201,169,110,.1); }
.filt-btn[data-f="b"].active{ border-color:#7aabcc;color:#7aabcc;background:rgba(122,171,204,.1); }
.filt-btn[data-f="all"].active{ border-color:#8a7a9e;color:#9a8aae;background:rgba(138,122,158,.1); }
.filt-btn[data-f="x"].active{ border-color:#d480c0;color:#d480c0;background:rgba(212,128,192,.1); }
.filter-count{ margin-left:auto;font-size:9px;color:#2a3a2e;font-family:"EB Garamond",serif; }

/* ── Card body ── */
.mini-bar{
  display:none;align-items:center;
  padding:5px 12px;gap:8px;min-height:30px;
  border-bottom:1px solid rgba(42,56,48,0.4);
}
.widget.mini .mini-bar{ display:flex; }
.widget.mini .filter-bar,
.widget.mini #study-view > .body,
.widget.mini #study-view > .prog-wrap,
.widget.mini #study-view > .acts,
.widget.mini #study-view > .stats,
.widget.mini #finish-view{ display:none !important; }
.mini-word{ font-family:"EB Garamond",serif;font-size:15px;font-weight:500;color:#e8e0d0;flex:1;letter-spacing:-.01em; }
.mini-cn{ font-size:10px;color:#6a9a7e;flex:1; }
.mini-prog{ font-size:9px;color:#2a3a2e;font-family:"EB Garamond",serif;white-space:nowrap; }
.mini-toggle{ font-size:11px;color:#3a4a3e;cursor:pointer;border:none;background:none;padding:2px 4px;border-radius:4px;flex-shrink:0; }
.mini-toggle:hover{ color:#7eb89a; }

.body{
  cursor:pointer;
  min-height:110px;
  perspective:600px;
  position:relative;
}
.card-inner{
  position:relative;
  width:100%;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
}
.card-inner.flipped{ transform:rotateY(180deg); }
.no-anim .card-inner{ transition:none !important; }
.card-inner.no-transition{ transition:none !important; }
.no-anim .answer{ transition:none !important; }
.no-anim .card-fav,.no-anim .tbtn,.no-anim .btn{ transition:none !important; }

.card-front,.card-back{
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  padding:16px 16px 8px;
}
.card-front{ position:relative; }
.card-back{
  position:absolute;top:0;left:0;right:0;
  transform:rotateY(180deg);
}
.cat-tag{
  display:inline-block;
  font-size:9px;letter-spacing:.14em;
  color:#4a7a62;text-transform:uppercase;
  font-family:"EB Garamond",serif;
  margin-bottom:7px;
}
.word-line{ display:flex;align-items:baseline;gap:8px;margin-bottom:2px; }
.word{
  font-family:"EB Garamond",serif;
  font-size:32px;font-weight:500;
  color:var(--text);letter-spacing:-.01em;line-height:1;
}
.pos{ font-size:10px;color:#3a4a3e;font-family:"EB Garamond",serif; }
.ph{ font-family:"EB Garamond",serif;font-size:12px;color:#3a4a3e;margin-bottom:8px; }

/* fav star */
.card-fav{
  position:absolute;top:12px;right:12px;
  width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.07);
  background:transparent;color:#2a3a2e;font-size:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.card-fav:hover{ color:#c9a96e;border-color:rgba(201,169,110,0.4); }
.card-fav.on{ color:#c9a96e;background:rgba(201,169,110,0.12);border-color:rgba(201,169,110,0.4); }

/* answer */
.answer{ overflow:hidden;max-height:0;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0; }
.answer.show{ max-height:200px;opacity:1; }
.def-cn{ font-size:17px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:3px; }
.def-en{ font-size:11px;color:#7a8a7e;font-family:"EB Garamond",serif;line-height:1.5;font-style:italic;margin-bottom:7px; }
.example{
  background:rgba(126,184,154,0.05);
  border-left:2px solid rgba(74,122,98,0.6);
  padding:5px 10px;border-radius:0 4px 4px 0;
  margin-bottom:3px;
}
.ex-en{ font-family:"EB Garamond",serif;font-size:11px;color:#7a8a7e;line-height:1.6;font-style:italic; }
.ex-cn{ font-size:10px;color:#3a4a3e;margin-top:2px;line-height:1.4; }
.tap-hint{ font-size:10px;color:#2a3a2e;letter-spacing:.1em;font-family:"EB Garamond",serif;margin-top:6px;transition:opacity .2s; }
.tap-hint.hide{ opacity:0; }

/* progress */
.prog-wrap{ padding:0 16px;margin-top:6px; }
.prog-bar{ height:2px;background:rgba(26,40,32,0.8);border-radius:1px;overflow:hidden; }
.prog-fill{ height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:1px;transition:width .5s cubic-bezier(.4,0,.2,1); }
.prog-info{ display:flex;justify-content:space-between;margin-top:4px;font-size:9px;color:#2a3a2e;font-family:"EB Garamond",serif; }

/* action buttons */
.acts{ display:flex;gap:8px;padding:8px 16px;border-top:1px solid rgba(42,56,48,0.5);margin-top:6px; }
.btn{
  flex:1;height:34px;border-radius:8px;border:1px solid;
  font-family:"Noto Serif SC",serif;font-size:11px;font-weight:500;
  cursor:pointer;letter-spacing:.05em;transition:all .18s;
}
.bu{ background:rgba(192,112,112,.06);border-color:rgba(192,112,112,.22);color:#b06060; }
.bu:hover{ border-color:rgba(192,112,112,.5);background:rgba(192,112,112,.12);color:#c07070; }
.bk{ background:rgba(var(--accent-rgb),.06);border-color:rgba(var(--accent-rgb),.22);color:var(--accent2); }
.bk:hover{ border-color:rgba(var(--accent-rgb),.5);background:rgba(var(--accent-rgb),.12);color:var(--accent); }

/* bottom stats */
.stats{ display:flex;align-items:center;justify-content:space-between;padding:5px 16px 10px; }
.stat{ display:flex;align-items:center;gap:4px;font-size:10px;color:#2a3a2e; }
.stat b{ font-family:"EB Garamond",serif;font-size:13px;font-weight:500; }
.stat.k b{ color:var(--accent); }.stat.u b{ color:#c07070; }
.streak{ font-size:9px;color:#b8944e;background:rgba(201,169,110,.08);border:1px solid rgba(201,169,110,.18);border-radius:20px;padding:2px 8px; }

/* finish screen */
.finish{ display:none;flex-direction:column;align-items:center;padding:20px 16px 16px;gap:10px;text-align:center; }
.finish.on{ display:flex; }
.fi-icon{ font-size:36px;line-height:1; }
.fi-title{ font-size:14px;font-weight:600;color:#e8e0d0;letter-spacing:.06em; }
.fi-sub{ font-size:11px;color:#7a8a7e;line-height:1.6; }
.fi-stats{ display:flex;gap:20px;background:rgba(255,255,255,.02);border:1px solid rgba(42,56,48,.7);border-radius:10px;padding:10px 18px; }
.fis{ text-align:center; }
.fis .n{ font-family:"EB Garamond",serif;font-size:22px;font-weight:500;line-height:1; }
.fis .l{ font-size:9px;color:#3a4a3e;margin-top:3px;letter-spacing:.08em; }
.fis.k .n{ color:#7eb89a; }.fis.u .n{ color:#c07070; }.fis.f .n{ color:#c9a96e; }
.fi-btns{ display:flex;gap:6px;flex-wrap:wrap;justify-content:center; }
.fb{ height:32px;border-radius:16px;border:none;font-family:"Noto Serif SC",serif;font-size:11px;font-weight:600;cursor:pointer;padding:0 14px;transition:opacity .2s;letter-spacing:.05em; }
.fb.restart{ background:linear-gradient(135deg,var(--accent2),var(--accent));color:#0a0f0c; }
.fb.review{ background:rgba(192,112,112,.1);border:1px solid rgba(192,112,112,.35);color:#c07070; }
.fb.fav-rev{ background:rgba(201,169,110,.1);border:1px solid rgba(201,169,110,.35);color:#c9a96e; }
.fb:hover{ opacity:.75; }

/* ── Word list panel ── */
.list-overlay{ position:absolute;left:0;right:0;top:34px;bottom:0;z-index:100;background:rgba(0,0,0,0.4);border-radius:0 0 16px 16px;display:none; }
.list-overlay.on{ display:block; }
.list-panel{
  position:absolute;left:0;right:0;bottom:0;top:0;
  background:var(--panel-bg);
  border-top:1px solid rgba(60,90,70,0.5);
  border-radius:0 0 16px 16px;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.list-overlay.on .list-panel{ transform:translateY(0); }
.list-header{
  display:flex;align-items:center;
  padding:8px 12px 6px;
  border-bottom:1px solid rgba(42,56,48,0.4);
  flex-shrink:0;gap:6px;
  cursor:default;
}
.list-header-drag{ flex:1;display:flex;align-items:center;gap:8px;cursor:default; }
.list-title{ font-size:11px;font-weight:600;color:#8aaa94;letter-spacing:.12em;flex-shrink:0; }
.list-tabs{ display:flex;gap:3px; }
.ltab{
  height:19px;padding:0 8px;border-radius:10px;
  border:1px solid rgba(60,90,70,0.3);background:transparent;
  color:#3a5040;font-family:"Noto Serif SC",serif;font-size:9px;
  cursor:pointer;transition:all .15s;
}
.ltab:hover{ color:var(--accent);border-color:rgba(var(--accent-rgb),0.3); }
.ltab.active{ background:rgba(var(--accent-rgb),0.1);border-color:var(--accent);color:var(--accent); }
.ltab[data-t="u"].active{ background:rgba(192,112,112,.1);border-color:#c07070;color:#c07070; }
.ltab[data-t="f"].active{ background:rgba(201,169,110,.1);border-color:#c9a96e;color:#c9a96e; }
.list-close{
  width:18px;height:18px;border-radius:50%;
  border:none;background:rgba(255,255,255,0.05);
  color:#3a4a3e;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
}
.list-close:hover{ background:rgba(192,112,112,0.15);color:#c07070; }
.list-search{
  display:flex;align-items:center;
  padding:5px 12px;gap:0;
  border-bottom:1px solid rgba(42,56,48,0.3);flex-shrink:0;
}
.list-search input{
  flex:1;background:rgba(255,255,255,0.03);
  border:1px solid rgba(60,90,70,0.3);border-radius:6px;
  padding:4px 10px;font-size:10px;color:#b8c0b4;
  outline:none;font-family:"Noto Serif SC",serif;
  transition:border-color .15s;
}
.list-search input::placeholder{ color:#2a3a2e; }
.list-search input:focus{ border-color:rgba(var(--accent-rgb),0.4);background:rgba(var(--accent-rgb),0.03); }
.list-body{ overflow-y:auto;flex:1;padding:2px 0; }
.list-item{
  display:flex;align-items:center;
  padding:5px 12px;gap:8px;
  border-bottom:1px solid rgba(42,56,48,0.15);

<script>

// ── Convert array vocab to object format ──────────────────────────────────
// vocab.js exports: const vocab = [[word, chinese, level, category], ...]
// category: c=core, h=high_freq, b=basic, a=advanced
const CAT_LABEL = { c:'核心词汇', h:'高频词汇', b:'基础词汇', a:'进阶词汇', x:'自定义词' };
const CAT_COLOR = { c:'#c9a96e', h:'#7eb89a', b:'#7aabcc', a:'#c07070', x:'#d480c0' };
let ALL = vocab.map(v => ({
  w: v[0], cn: v[1], lv: v[2], cat: v[3] || 'h',
  p: '', ph: '', en: '', ee: '', ec: '',
  c: CAT_LABEL[v[3]] || '高频学术'
}));
const WORD_MAP = {};
ALL.forEach(v => { WORD_MAP[v.w] = v; });

// File I/O helpers (must be before custom vocab loading)
const _fs   = (typeof require !== 'undefined') ? require('fs')   : null;
const _path2 = (typeof require !== 'undefined') ? require('path') : null;
const _stateFile = (_fs && _path2) ? _path2.join(process.env.APPDATA || '', 'ielts-widget', 'progress.json') : null;
if (_fs && _stateFile) { try { _fs.mkdirSync(_path2.dirname(_stateFile), {recursive:true}); } catch(e) {} }

// Load custom vocab additions and deletions
var _customData = null;
try {
  const _cfile = (_fs && _path2) ? _path2.join(process.env.APPDATA || '', 'ielts-widget', 'custom_vocab.json') : null;
  if (_fs && _cfile && _fs.existsSync(_cfile)) {
    _customData = JSON.parse(_fs.readFileSync(_cfile, 'utf8'));
    // Add custom words
    (_customData.words || []).forEach(v => {
      if (!WORD_MAP[v.w]) {
        const entry = { w:v.w, cn:v.cn||'', lv:2, cat:v.cat||'h', p:v.p||'', ph:v.ph||'', en:v.en||'', ee:v.ee||'', ec:'', c: CAT_LABEL[v.cat]||'自定义', _custom:true };
        ALL.push(entry);
        WORD_MAP[v.w] = entry;
      }
    });
    // Remove deleted words
    const deleted = new Set(_customData.deleted || []);
    if (deleted.size > 0) {
      ALL = ALL.filter(v => !deleted.has(v.w));
      deleted.forEach(w => { delete WORD_MAP[w]; });
    }
  }
  // Apply category overrides (user reclassified words)
  if (_customData && _customData.categories) {
    Object.keys(_customData.categories).forEach(function(k) {
      var entry = WORD_MAP[k];
      if (entry) {
        entry.cat = _customData.categories[k];
        entry.c = CAT_LABEL[_customData.categories[k]] || entry.c;
      }
    });
  }
  // Apply priority flags (starred words appear first)
  if (_customData && _customData.priority) {
    var _priSet = new Set(_customData.priority || []);
    ALL.forEach(function(v) { if (_priSet.has(v.w)) v._pri = true; });
  }
} catch(e) {}

// Filter includes: c=核心only, h=核心+高频, b=核心+高频+基础, all=全部
const CAT_INCLUDES = { c:['c'], h:['c','h'], b:['c','h','b'], all:['c','h','b','a'], x:['x'] };
let activeFilter = 'all';
function getFilteredWords() {
  if (activeFilter === 'x') return ALL.filter(v => v._custom === true);
  if (activeFilter === 'all') return ALL;
  const allowed = CAT_INCLUDES[activeFilter] || ['c','h','b','a'];
  return ALL.filter(v => allowed.includes(v.cat) && !v._custom);
}
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filt-btn').forEach(btn => {

function _readProgress() {
  if (!_fs || !_stateFile) return {};

}
function _writeProgress(obj) {

}

// Daily stats
let dailyStats = { date:'', count:0, dayStreak:0 };

function todayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function loadState() {
  try {
    const d = _readProgress();
    if (!d || Object.keys(d).length === 0) return;
    known   = new Set(d.known   || []);
    unknown = new Set(d.unknown || []);
    favs    = new Set(d.favs    || []);
    streak  = d.streak || 0;
    srQueue = d.srQueue || [];
    dailyStats = d.dailyStats || { date:'', count:0, dayStreak:0 };
    const today = todayStr();
    if (dailyStats.date !== today) {
      const wasYesterday = dailyStats.date === (() => {
        const y = new Date(); y.setDate(y.getDate()-1);
        return y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
      })();
      dailyStats = { date: today, count: 0, dayStreak: wasYesterday ? (dailyStats.dayStreak||0)+1 : 1 };
    }
  } catch(e) {}
}
function saveState() {
  try {
    _writeProgress({
      known:[...known], unknown:[...unknown], favs:[...favs], streak,
      srQueue, dailyStats
    });
  } catch(e) {}
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildDeck(words) {
  const now = Date.now();
  // Collect SR due words (not in current word list to avoid collision)
  const srDue = srQueue.filter(e => e.due <= now).map(e => WORD_MAP[e.w]).filter(Boolean);
  // Remove from srQueue
  srQueue = srQueue.filter(e => e.due > now);
  // Interleave SR words every 5 cards
  var _priW = words.filter(function(v){return v._pri;});
  var _norW = words.filter(function(v){return !v._pri;});
  var base = shuffle([].concat(_priW)).concat(shuffle([].concat(_norW)));
  deck = [];
  var srIdx = 0;
  for (var i = 0; i < base.length; i++) {
    if (srIdx < srDue.length && i > 0 && i % 5 === 0) {
      deck.push({ ...srDue[srIdx++], _sr: true });
    }
    deck.push(base[i]);
  }
  while (srIdx < srDue.length) deck.push({ ...srDue[srIdx++], _sr: true });
  idx = 0;
}

function mark(isKnown) {
  const v = deck[idx]; if (!v) return;
  if (isKnown) {
    known.add(v.w); unknown.delete(v.w); streak++;
    // Remove from SR queue if it was there
    srQueue = srQueue.filter(e => e.w !== v.w);
  } else {
    unknown.add(v.w); known.delete(v.w); streak = 0;
    // Schedule SR: re-show in ~5 new cards (roughly 30s-2min later)
    if (!v._sr) {
      srQueue = srQueue.filter(e => e.w !== v.w);
      srQueue.push({ w: v.w, due: Date.now() + 60000 }); // re-due in 60s
    }
  }
  // Daily count
  dailyStats.count++;
  saveState();
  idx++;
  updateStreakBanner();
  renderCard();
}

  document.getElementById('mini-word').textContent = v.w;
  document.getElementById('mini-cn').textContent = v.cn;
  var total = getFilteredWords().length;
  var done = known.size + unknown.size;
  document.getElementById('mini-prog').textContent = done + '/' + total + ' (' + Math.round(done/Math.max(1,total)*100) + '%)';
}

// ── Daily streak banner ───────────────────────────────────────────────────
function updateStreakBanner() {
  const el = document.getElementById('streak-banner');
  if (dailyStats.dayStreak >= 2 || dailyStats.count >= 10) {
    el.classList.remove('hide');
    el.textContent = `🔥 连续学习 ${dailyStats.dayStreak} 天 · 今日已学 ${dailyStats.count} 词`;
  } else if (dailyStats.count > 0) {
    el.classList.remove('hide');
    el.textContent = `今日已学 ${dailyStats.count} 词`;
  } else {
    el.classList.add('hide');
  }
}

// ── TTS ───────────────────────────────────────────────────────────────────
// ── Pin / always-on-top toggle ──────────────────────────────────────────
function togglePin() {
  pinned = !pinned;
  const btn = document.getElementById('pin-btn');
  btn.classList.toggle('on', pinned);
  btn.title = pinned ? '取消置顶' : '置顶';
  btn.textContent = pinned ? '⊕' : '⊖';
  if (ipc) ipc.send('win-topmost', pinned);
}

function speakCurrent() { const _v = deck && deck[idx]; if (_v) speak(_v.w); }
function speak(word) {
  try {
    if (!window.speechSynthesis) return;
    if (isSilent) return;
    const w = word || (deck[idx] && deck[idx].w);
    if (!w) return;
    window.speechSynthesis.cancel();
    const btn = document.getElementById('speak-btn');
    if (btn) { btn.textContent = '…'; btn.style.color = '#7eb89a'; }
    const u = new SpeechSynthesisUtterance(w);
    u.onend = () => { if (btn) { btn.textContent = '♪'; btn.style.color = ''; } };
    u.onerror = () => { if (btn) { btn.textContent = '♪'; btn.style.color = ''; } };
    u.lang = 'en-US'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}



function miniToggleReveal() {
  if (!isMini) return;
  if (!revealed) revealAnswer();
  else { idx++; renderCard(); }
}
function reviewFavQuick() {
  const words = ALL.filter(v => favs.has(v.w));
  if (!words.length) { return; }
  isReview = true; buildDeck(words); renderCard();
}

// ── Theme ─────────────────────────────────────────────────────────────────
function toggleThemePanel() {
  document.getElementById('theme-panel').classList.toggle('on');
}
function setTheme(cls) {
  const themes = ['theme-blue','theme-purple','theme-amber','theme-rose','theme-light'];
  // Apply to both html and widget so CSS vars cascade correctly
  const root = document.documentElement;
  const w = document.getElementById('widget');
  themes.forEach(c => { root.classList.remove(c); w.classList.remove(c); });
  if (cls) { root.classList.add(cls); w.classList.add(cls); }
  document.querySelectorAll('.theme-opt').forEach(o => {
    o.classList.toggle('active', o.dataset.theme === cls);
  });
  document.getElementById('theme-panel').classList.remove('on');
  try { localStorage.setItem('ielts_theme', cls); } catch(e) {}
  setTimeout(autoResize, 50);
}
// Load saved theme
(function() {
  try {
    const t = localStorage.getItem('ielts_theme');
    if (t) setTheme(t);
  } catch(e) {}
})();
// ── More menu ─────────────────────────────────────────────────────────────
function toggleMoreMenu() {
  var m = document.getElementById('more-menu');
  var btn = document.getElementById('more-btn');
  if (!m || !btn) return;
  if (m.style.display === 'block') {
    m.style.display = 'none';
  } else {
    var r = btn.getBoundingClientRect();
    m.style.left = (r.left + 8) + 'px';
    m.style.top = (r.bottom + 4) + 'px';
    m.style.display = 'block';
  }
}
// Close more menu on outside click
document.addEventListener('click', function(e) {
  var m = document.getElementById('more-menu');
  if (!m) return;
  if (!e.target.closest('#more-menu') && !e.target.closest('#more-btn')) {
    m.style.display = 'none';
  }
});
// Close theme panel on outside click
document.addEventListener('click', e => {
  const panel = document.getElementById('theme-panel');
  const btn = document.getElementById('theme-btn');
  if (panel && panel.classList.contains('on') && !panel.contains(e.target) && e.target !== btn) {
    panel.classList.remove('on');
  }
});


// ── Custom Keybindings ────────────────────────────────────────────────────
const KB_KEY = 'ielts_keybindings';
const KB_DEFAULTS = {
  reveal:  [' ','Enter'],
  known:   ['ArrowRight','l'],
  unknown: ['ArrowLeft','h'],
  skip:    ['ArrowDown','s'],
  prev:    ['Backspace','z'],
  fav:     ['f'],
  speak:   ['p'],
  mini:    ['m'],
};
let KB = {};
function loadKeybindings() {
  try {
    const saved = JSON.parse(localStorage.getItem(KB_KEY) || '{}');
    Object.keys(KB_DEFAULTS).forEach(k => {
      KB[k] = (saved[k] || KB_DEFAULTS[k]).map(x => x.toLowerCase());
    });
  } catch(e) {
    Object.keys(KB_DEFAULTS).forEach(k => { KB[k] = KB_DEFAULTS[k].map(x => x.toLowerCase()); });
  }
}
function matchKey(e, action) {
  const k = e.key === ' ' ? ' ' : e.key.toLowerCase();
  return KB[action] && KB[action].includes(k);
}
loadKeybindings();
// Reload keybindings when window regains focus (user may have changed settings)
window.addEventListener('focus', () => { try { loadKeybindings(); } catch(e) {} });
function openKeybindings() {
  if (ipc) ipc.send('open-tool-keybindings');
  else window.open('keybindings.html');
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────
// Space / Enter  = reveal answer (or next card if already revealed)
// ArrowRight / K = mark known
// ArrowLeft  / J = mark unknown
// F              = toggle fav
// Escape         = close list panel
document.addEventListener('keydown', e => {
  // ── 列表面板打开时 ────────────────────────────────────────────
  if (document.getElementById('list-overlay').classList.contains('on')) {
    if ((e.key==='h'||e.key==='H') && e.ctrlKey && e.shiftKey) { e.preventDefault(); if(ipc) ipc.send('win-hide'); return; }
    if (e.key === 'Escape') {
      // Close detail modal first if open
      const dw = document.getElementById('word-detail');
      if (dw && dw.classList.contains('on')) { closeDetail(); e.preventDefault(); return; }
      const si = document.getElementById('list-search-input');
      if (si && si.value) { si.value = ''; renderList(); si.blur(); }
      else { closeList(); }
      e.preventDefault();
    }
    return;
  }
  if ((e.key==='h'||e.key==='H') && e.ctrlKey && e.shiftKey) { e.preventDefault(); if(ipc) ipc.send('win-hide'); return; }
  // ── 完成页 ────────────────────────────────────────────────────
  if (document.getElementById('finish-view').classList.contains('on')) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); restartAll(); }
    return;
  }
  // ── 学习页 ────────────────────────────────────────────────────
  // 不拦截输入框
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'F1')                  { e.preventDefault(); revealAnswer(); }
  else if (e.key === 'F2')           { if (revealed) { e.preventDefault(); mark(true); } }
  else if (e.key === 'F3')           { if (revealed) { e.preventDefault(); mark(false); } }
  else if (matchKey(e,'reveal'))     { e.preventDefault(); revealAnswer(); }
  else if (matchKey(e,'known'))      { if (revealed) { e.preventDefault(); mark(true); } }
  else if (matchKey(e,'unknown'))    { if (revealed) { e.preventDefault(); mark(false); } }
  else if (matchKey(e,'skip'))    { e.preventDefault(); skipCard(); }
  else if (matchKey(e,'prev'))    { e.preventDefault(); prevCard(); }
  else if (matchKey(e,'fav'))     { e.preventDefault(); toggleFav({ stopPropagation: () => {} }); }
  else if (matchKey(e,'speak'))   { e.preventDefault(); speakCurrent(); }
  else if (matchKey(e,'mini'))    { e.preventDefault(); toggleMini(); }
  else if (e.key === 'Escape')    { closeList(); }
});
</script>
